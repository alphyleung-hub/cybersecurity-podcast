name: Daily Podcast Generator

on:
  schedule:
    # Runs every day at 22:00 UTC (which is 06:00 HKT next day)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows you to manually trigger it for testing

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Generate Script and MP3
        run: python generate_podcast.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-update: Daily Podcast $(date)" || exit 0
          git push
