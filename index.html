<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Cybersecurity 日報 | Daily Podcast</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 20px 0; border-bottom: 2px solid var(--primary); }
        h1 { margin: 0; color: var(--primary); font-size: 2rem; }
        .subtitle { color: #64748b; margin-top: 5px; }
        
        .episode-card { background: var(--card); border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .episode-card:hover { transform: translateY(-2px); }
        .date-badge { display: inline-block; background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
        
        audio { width: 100%; margin: 15px 0; border-radius: 8px; }
        
        .script-box { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 0.95rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto; border-left: 4px solid var(--primary); }
        .source-link { display: block; margin-top: 10px; color: var(--primary); text-decoration: none; font-size: 0.9rem; }
        .source-link:hover { text-decoration: underline; }
        
        footer { text-align: center; margin-top: 50px; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ IT Cybersecurity 日報</h1>
            <p class="subtitle">每日自動更新 · 廣東話播客 · 7日存檔</p>
        </header>

        <div id="episodes-container">
            <!-- Episodes will be injected here by JavaScript -->
            <p style="text-align:center; color:#64748b;">載入中...</p>
        </div>

        <footer>
            <p>Powered by GitHub Actions & Cloudflare Pages</p>
            <p>新聞來源: The Hacker News</p>
        </footer>
    </div>

    <script>
        // List of known episodes (You can also make this dynamic via a JSON manifest later)
        // For now, we assume filenames follow: YYYY-MM-DD_IT_Cybersecurity.mp3
        // Since JS can't list server files, we will use a simple pattern or you can manually add new ones.
        // BETTER APPROACH FOR STATIC SITE: We will generate a small 'manifest.json' in Python later.
        // FOR NOW: Let's use a placeholder that you update, OR better yet, let's modify Python to output this HTML list.
        
        // ⚠️ IMPORTANT: Because this is a static site, JS cannot scan the folder for files.
        // The Python script MUST generate a 'manifest.json' file that this page reads.
        
        async function loadEpisodes() {
            try {
                const response = await fetch('manifest.json');
                const episodes = await response.json();
                
                const container = document.getElementById('episodes-container');
                container.innerHTML = ''; // Clear loading message

                // Sort by date descending
                episodes.sort((a, b) => new Date(b.date) - new Date(a.date));

                episodes.forEach(ep => {
                    const card = document.createElement('div');
                    card.className = 'episode-card';
                    
                    // Format date for display
                    const dateObj = new Date(ep.date);
                    const dateStr = dateObj.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

                    card.innerHTML = `
                        <span class="date-badge">${dateStr}</span>
                        <audio controls preload="metadata">
                            <source src="${ep.mp3}" type="audio/mpeg">
                            您的瀏覽器不支援音頻播放。
                        </audio>
                        <div class="script-box">${ep.script}</div>
                        ${ep.sources ? ep.sources.map(s => `<a href="${s.url}" target="_blank" class="source-link">🔗 新聞來源: ${s.title}</a>`).join('') : ''}
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('episodes-container').innerHTML = 
                    `<p style="color:red; text-align:center;">無法載入節目列表。請檢查 manifest.json 是否存在。<br>Error: ${e.message}</p>`;
            }
        }

        loadEpisodes();
    </script>
</body>
</html>
