name: Daily Podcast Generator  

on:
  schedule:
    - cron: '0 22 * * *'  # 06:00 HKT daily
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper merging
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generate Script and MP3
        run: |
          echo "🎙️ Starting podcast generation..."
          python generate_podcast.py
          echo "✅ Generation complete."
          ls -la *.mp3 || echo "No MP3 found"
        
      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add .
          
          # Check if there are changes to commit
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "🤖 Auto-update: Daily Podcast $(date '+%Y-%m-%d %H:%M')"
          
          # Pull latest changes and rebase before pushing
          git pull --rebase origin main
          
          # Push with force-with-lease (safer than plain force)
          git push origin main