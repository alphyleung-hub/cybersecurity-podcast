name: Daily Podcast Generator

on:
  schedule:
    - cron: '0 22 * * *'  # 06:00 HKT daily
  workflow_dispatch:      # Manual trigger for testing

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ✅ FIX 1: Updated to v4/v5 to fix Node.js 20 deprecation warning
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # ✅ FIX 2: Install ffmpeg (required by edge-tts on Linux)
      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # ✅ FIX 3: Added verbose output to catch real errors
      - name: Generate Script and MP3
        run: |
          echo "=== Starting generation ==="
          python generate_podcast.py
          echo "=== Generation complete ==="
          ls -la *.mp3 || echo "ERROR: MP3 file not found!"
        
      # ✅ FIX 4: Safe commit (won't fail if no changes)
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto-update: $(date)"
          git push
