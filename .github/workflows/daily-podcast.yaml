name: Daily Podcast Generator

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    # CRITICAL: This allows the bot to push code back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: pip install -r requirements.txt
          
      - name: Generate Script and MP3
        run: python generate_podcast.py
        
      - name: Commit and Push (Force Push to avoid conflicts)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update: $(date)"
            # FORCE PUSH is the key to fixing your error
            git push --force origin main
          else
            echo "No changes to commit."
          fi